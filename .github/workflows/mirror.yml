# Auto-mirror this repo to GitLab and/or Bitbucket on every push.
# Secrets: GITLAB_MIRROR_URL, BITBUCKET_MIRROR_URL (unset = skipped).
name: Mirror to GitLab & Bitbucket
on:
  push:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror push
        env:
          GITLAB_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          BITBUCKET_URL: ${{ secrets.BITBUCKET_MIRROR_URL }}
          SRC: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git clone --mirror "$SRC" repo.git
          cd repo.git
          fail=0

          if [ -n "$GITLAB_URL" ]; then
            echo "=== pushing to GitLab ==="
            if git push --mirror "$GITLAB_URL"; then echo "GitLab: OK"; else echo "GitLab: FAILED"; fail=1; fi
          else echo "GitLab: skipped (no secret)"; fi

          if [ -n "$BITBUCKET_URL" ]; then
            echo "=== pushing to Bitbucket ==="
            # Pull the token out of the URL and auth via header instead of URL
            # userinfo, so special chars in the token (e.g. '=') can't break parsing.
            rest=${BITBUCKET_URL#https://x-token-auth:}
            BB_TOKEN=${rest%@*}
            BB_PATH=${rest##*@}
            AUTH=$(printf 'x-token-auth:%s' "$BB_TOKEN" | base64 -w0)
            if git -c http.extraHeader="Authorization: Basic $AUTH" push --mirror "https://$BB_PATH"; then
              echo "Bitbucket: OK"
            elif git -c http.extraHeader="Authorization: Bearer $BB_TOKEN" push --mirror "https://$BB_PATH"; then
              echo "Bitbucket: OK (bearer)"
            else
              echo "Bitbucket: FAILED"; fail=1
            fi
          else echo "Bitbucket: skipped (no secret)"; fi

          echo "=== done (fail=$fail) ==="
          exit $fail
