name: Mirror to GitLab & Bitbucket
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror push
        env:
          GITLAB_URL: ${{ secrets.GITLAB_MIRROR_URL }}
          BITBUCKET_URL: ${{ secrets.BITBUCKET_MIRROR_URL }}
          SRC: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          : > status.txt
          echo "mirror run $(date -u)" >> status.txt
          git clone --mirror "$SRC" repo.git
          cd repo.git
          if [ -n "$GITLAB_URL" ]; then
            out=$(git push --mirror "$GITLAB_URL" 2>&1); rc=$?
            { echo "== GitLab (rc=$rc) =="; echo "$out"; } >> ../status.txt
          fi
          if [ -n "$BITBUCKET_URL" ]; then
            rest=${BITBUCKET_URL#https://x-token-auth:}
            BB_TOKEN=${rest%@*}
            BB_PATH=${rest##*@}
            BB_HTTPS="https://$BB_PATH"
            enc=$(printf '%s' "$BB_TOKEN" | sed 's/=/%3D/g')
            echo "== Bitbucket diag token_len=${#BB_TOKEN} last4=${BB_TOKEN: -4} path=$BB_PATH ==" >> ../status.txt
            # v1: URL raw token
            o=$(git push --mirror "https://x-token-auth:${BB_TOKEN}@${BB_PATH}" 2>&1); echo "v1 url-raw rc=$? -> $(echo "$o"|tail -1)" >> ../status.txt
            # v2: URL with =%3D encoded
            o=$(git push --mirror "https://x-token-auth:${enc}@${BB_PATH}" 2>&1); echo "v2 url-enc rc=$? -> $(echo "$o"|tail -1)" >> ../status.txt
            # v3: header Basic
            o=$(git -c http.extraHeader="Authorization: Basic $(printf 'x-token-auth:%s' "$BB_TOKEN"|base64 -w0)" push --mirror "$BB_HTTPS" 2>&1); echo "v3 hdr-basic rc=$? -> $(echo "$o"|tail -1)" >> ../status.txt
            # v4: header Bearer
            o=$(git -c http.extraHeader="Authorization: Bearer ${BB_TOKEN}" push --mirror "$BB_HTTPS" 2>&1); echo "v4 hdr-bearer rc=$? -> $(echo "$o"|tail -1)" >> ../status.txt
          fi
          cd ..
          cat status.txt
          content=$(base64 -w0 status.txt)
          sha=$(curl -s -H "Authorization: Bearer $GH" "https://api.github.com/repos/$REPO/contents/mirror-status.txt?ref=main" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null)
          body="{\"message\":\"chore: mirror status [skip ci]\",\"content\":\"$content\",\"branch\":\"main\""
          [ -n "$sha" ] && body="$body,\"sha\":\"$sha\""
          body="$body}"
          curl -s -X PUT -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/contents/mirror-status.txt" -d "$body" >/dev/null
          echo "status written"
