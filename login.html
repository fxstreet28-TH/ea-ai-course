<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050610">
<meta name="robots" content="noindex">
<title>เข้าสู่ระบบ — EA / AI</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main class="auth-page">
  <a class="brand" href="/" style="display:inline-flex;align-items:center;justify-content:center;line-height:0"><img src="/assets/logo.jpg?v=2" alt="LongLearnDo Academy" width="52" height="52" style="height:52px;width:52px;border-radius:12px;display:block"></a>

  <div class="auth-card panel">
    <!-- login / signup -->
    <section id="view-auth">
      <div class="tabs" role="tablist" aria-label="เลือกการใช้งาน">
        <button type="button" role="tab" id="tab-login" aria-controls="form-login" aria-selected="true">เข้าสู่ระบบ</button>
        <button type="button" role="tab" id="tab-signup" aria-controls="form-signup" aria-selected="false">สมัครสมาชิก</button>
      </div>

      <button type="button" class="btn-google" id="btn-google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span>เข้าสู่ระบบด้วย Google</span>
      </button>
      <div class="msg" id="google-msg" role="alert" aria-live="polite"></div>

      <div class="divider">หรือใช้อีเมล</div>

      <form id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <div class="field">
          <label for="login-email">อีเมล</label>
          <input type="email" id="login-email" name="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="login-password">รหัสผ่าน</label>
          <div class="input-wrap">
            <input type="password" id="login-password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" data-toggle="login-password" aria-label="แสดงรหัสผ่าน">แสดง</button>
          </div>
        </div>
        <div class="row-end"><button type="button" class="link" data-go="forgot">ลืมรหัสผ่าน?</button></div>
        <button type="submit" class="btn block">เข้าสู่ระบบ</button>
        <div class="msg" id="login-msg" role="alert" aria-live="polite"></div>
        <div id="login-resend" hidden style="margin-top:10px;text-align:center">
          <button type="button" class="link" id="login-resend-btn">ส่งอีเมลยืนยันอีกครั้ง</button>
        </div>
      </form>

      <form id="form-signup" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
        <div class="field">
          <label for="signup-email">อีเมล</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="signup-password">รหัสผ่าน</label>
          <div class="input-wrap">
            <input type="password" id="signup-password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="signup-pw-hint">
            <button type="button" class="toggle-pw" data-toggle="signup-password" aria-label="แสดงรหัสผ่าน">แสดง</button>
          </div>
          <div class="hint" id="signup-pw-hint">อย่างน้อย 8 ตัวอักษร</div>
        </div>
        <div class="field">
          <label for="signup-confirm">ยืนยันรหัสผ่าน</label>
          <div class="input-wrap">
            <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-pw" data-toggle="signup-confirm" aria-label="แสดงรหัสผ่าน">แสดง</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="signup-terms" required> <span>ฉันยอมรับเงื่อนไขการใช้งานและนโยบายความเป็นส่วนตัว</span></label>
        <button type="submit" class="btn block">สมัครสมาชิก</button>
        <div class="msg" id="signup-msg" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <!-- signup success -->
    <section id="view-sent" class="success-box" hidden>
      <div class="icon" aria-hidden="true">✉️</div>
      <h1>เช็คอีเมลของคุณ</h1>
      <p>ส่งอีเมลยืนยันไปที่ <strong id="sent-email"></strong> แล้ว กดลิงก์ในอีเมลเพื่อเปิดใช้บัญชี</p>
      <p style="font-size:13px">ไม่เห็นอีเมล? ลองเช็คโฟลเดอร์สแปม/โปรโมชัน</p>
      <button type="button" class="btn outline block" id="btn-resend">ส่งอีเมลยืนยันอีกครั้ง</button>
      <div class="msg" id="sent-msg" role="alert" aria-live="polite"></div>
      <p class="foot-note"><button type="button" class="link" data-go="login">กลับไปหน้าเข้าสู่ระบบ</button></p>
    </section>

    <!-- forgot password -->
    <section id="view-forgot" hidden>
      <span class="eyebrow en">RESET PASSWORD</span>
      <h1>ลืมรหัสผ่าน</h1>
      <p class="lead">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
      <form id="form-forgot" novalidate>
        <div class="field">
          <label for="forgot-email">อีเมล</label>
          <input type="email" id="forgot-email" name="email" autocomplete="email" inputmode="email" required>
        </div>
        <button type="submit" class="btn block">ส่งลิงก์ตั้งรหัสใหม่</button>
        <div class="msg" id="forgot-msg" role="alert" aria-live="polite"></div>
      </form>
      <p class="foot-note"><button type="button" class="link" data-go="login">กลับไปหน้าเข้าสู่ระบบ</button></p>
    </section>
  </div>

  <p class="foot-note"><a href="/">← กลับหน้าแรก</a></p>
</main>

<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/assets/auth.js"></script>
<script>
(function () {
  'use strict';
  var A = window.EAAuth;
  var $ = function (id) { return document.getElementById(id); };
  var BUSY = 'กำลังดำเนินการ…';
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var next = A ? A.nextFromUrl() : '/learn.html';

  function showMsg(el, text, kind) { el.className = 'msg ' + (kind || 'error'); el.textContent = text || ''; }
  function clearMsgs() { document.querySelectorAll('.msg').forEach(function (m) { m.textContent = ''; }); }
  function setBusy(btn, busy) {
    if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.textContent = BUSY; }
    else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }
  function errText(e) { return A ? A.mapAuthError(e) : 'ระบบสมาชิกยังไม่พร้อมใช้งาน กรุณาลองใหม่ภายหลัง'; }

  // ---- views ----
  function go(view) {
    clearMsgs();
    $('view-auth').hidden = !(view === 'login' || view === 'signup');
    $('view-sent').hidden = view !== 'sent';
    $('view-forgot').hidden = view !== 'forgot';
    if (view === 'login' || view === 'signup') {
      var isLogin = view === 'login';
      $('tab-login').setAttribute('aria-selected', String(isLogin));
      $('tab-signup').setAttribute('aria-selected', String(!isLogin));
      $('form-login').hidden = !isLogin;
      $('form-signup').hidden = isLogin;
      document.title = (isLogin ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก') + ' — EA / AI';
    } else if (view === 'forgot') {
      document.title = 'ลืมรหัสผ่าน — EA / AI';
    }
  }
  $('tab-login').addEventListener('click', function () { go('login'); });
  $('tab-signup').addEventListener('click', function () { go('signup'); });
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
  });

  // ---- show / hide password ----
  document.querySelectorAll('[data-toggle]').forEach(function (b) {
    b.addEventListener('click', function () {
      var input = $(b.getAttribute('data-toggle'));
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.textContent = show ? 'ซ่อน' : 'แสดง';
      b.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
    });
  });

  // ---- resend with 60s cooldown ----
  var cooldownTimer = null;
  function startCooldown(btn, seconds) {
    var label = 'ส่งอีเมลยืนยันอีกครั้ง';
    var left = seconds;
    btn.disabled = true;
    btn.textContent = label + ' (' + left + ' วิ)';
    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(function () {
      left -= 1;
      if (left <= 0) { clearInterval(cooldownTimer); btn.disabled = false; btn.textContent = label; }
      else btn.textContent = label + ' (' + left + ' วิ)';
    }, 1000);
  }
  async function resend(email, btn, msgEl) {
    showMsg(msgEl, '');
    btn.disabled = true; btn.textContent = BUSY;
    try {
      await A.resendConfirmation(email);
      showMsg(msgEl, 'ส่งอีเมลยืนยันอีกครั้งแล้ว', 'success');
      startCooldown(btn, 60);
    } catch (e) {
      showMsg(msgEl, errText(e));
      btn.disabled = false; btn.textContent = 'ส่งอีเมลยืนยันอีกครั้ง';
    }
  }

  // ---- Google ----
  $('btn-google').addEventListener('click', async function () {
    var btn = this;
    showMsg($('google-msg'), '');
    setBusy(btn, true);
    try { await A.signInWithGoogle(next); /* browser navigates to Google */ }
    catch (e) { showMsg($('google-msg'), errText(e)); setBusy(btn, false); }
  });

  // ---- login ----
  var lastLoginEmail = '';
  $('form-login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('[type=submit]');
    var msg = $('login-msg');
    var email = $('login-email').value.trim();
    var pw = $('login-password').value;
    $('login-resend').hidden = true;
    if (!EMAIL_RE.test(email)) return showMsg(msg, 'รูปแบบอีเมลไม่ถูกต้อง');
    if (!pw) return showMsg(msg, 'กรุณากรอกรหัสผ่าน');
    showMsg(msg, '');
    setBusy(btn, true);
    try {
      await A.signInEmail(email, pw);
      location.replace(next);
    } catch (e) {
      showMsg(msg, errText(e));
      var code = String((e && (e.code || e.message)) || '').toLowerCase();
      if (code.indexOf('not confirmed') !== -1 || code.indexOf('email_not_confirmed') !== -1) {
        lastLoginEmail = email;
        $('login-resend').hidden = false;
      }
      setBusy(btn, false);
    }
  });
  $('login-resend-btn').addEventListener('click', function () { resend(lastLoginEmail, this, $('login-msg')); });

  // ---- signup ----
  var signupEmail = '';
  $('form-signup').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('[type=submit]');
    var msg = $('signup-msg');
    var email = $('signup-email').value.trim();
    var pw = $('signup-password').value;
    var pw2 = $('signup-confirm').value;
    if (!EMAIL_RE.test(email)) return showMsg(msg, 'รูปแบบอีเมลไม่ถูกต้อง');
    if (pw.length < 8) return showMsg(msg, 'รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร');
    if (pw !== pw2) return showMsg(msg, 'รหัสผ่านทั้งสองช่องไม่ตรงกัน');
    if (!$('signup-terms').checked) return showMsg(msg, 'กรุณายอมรับเงื่อนไขการใช้งานก่อนสมัคร');
    showMsg(msg, '');
    setBusy(btn, true);
    try {
      var data = await A.signUpEmail(email, pw);
      if (data && data.session) { location.replace(next); return; } // "Confirm email" disabled
      signupEmail = email;
      $('sent-email').textContent = email;
      go('sent');
      startCooldown($('btn-resend'), 60);
    } catch (e) {
      showMsg(msg, errText(e));
    }
    setBusy(btn, false);
  });
  $('btn-resend').addEventListener('click', function () { resend(signupEmail, this, $('sent-msg')); });

  // ---- forgot ----
  $('form-forgot').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = this.querySelector('[type=submit]');
    var msg = $('forgot-msg');
    var email = $('forgot-email').value.trim();
    if (!EMAIL_RE.test(email)) return showMsg(msg, 'รูปแบบอีเมลไม่ถูกต้อง');
    showMsg(msg, '');
    setBusy(btn, true);
    try {
      await A.resetPassword(email);
      showMsg(msg, 'ถ้าอีเมลนี้มีในระบบ เราส่งลิงก์ตั้งรหัสใหม่ให้แล้ว (เช็คกล่องจดหมาย/สแปม)', 'success');
    } catch (e) {
      showMsg(msg, errText(e));
    }
    setBusy(btn, false);
  });

  // ---- initial state ----
  var mode = new URLSearchParams(location.search).get('mode');
  go(mode === 'signup' || mode === 'forgot' ? mode : 'login');

  var linkErr = A && A.getUrlAuthError();
  if (linkErr) {
    go('login');
    showMsg($('login-msg'), 'ลิงก์หมดอายุหรือถูกใช้แล้ว กรุณาขอใหม่');
    history.replaceState(null, '', location.pathname + location.search);
  }

  // Already signed in → straight to the classroom.
  if (A && A.isConfigured()) {
    A.getSession().then(function (s) { if (s) location.replace(next); }).catch(function () {});
  }
})();
</script>
</body>
</html>
